<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- KolinOS "Corvo Glass" desktop wallpaper (1920x1080).
       Tokens in colours; rendered to PNG by scripts/artifacts/render-assets.sh. -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="95%">
      <stop offset="0%"  stop-color="#@KOLIN_GLASS_SURFACE@"/>
      <stop offset="52%" stop-color="#@KOLIN_GLASS_BASE@"/>
      <stop offset="100%" stop-color="#@KOLIN_GLASS_VOID@"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#@KOLIN_GLASS_PRIMARY_HI@"/>
      <stop offset="100%" stop-color="#@KOLIN_GLASS_PRIMARY@"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#@KOLIN_GLASS_ACCENT@"/>
      <stop offset="100%" stop-color="#@KOLIN_GLASS_PRIMARY@"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur140" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="140"/>
    </filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="40" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- orbs -->
  <circle cx="330" cy="240" r="360" fill="url(#violet)" opacity="0.7" filter="url(#blur140)"/>
  <circle cx="1650" cy="900" r="400" fill="url(#cyan)" opacity="0.5" filter="url(#blur140)"/>
  <circle cx="1520" cy="300" r="200" fill="#@KOLIN_GLASS_ACCENT@" opacity="0.28" filter="url(#blur140)"/>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 270 H1920 M0 540 H1920 M0 810 H1920"/>
    <path d="M480 0 V1080 M960 0 V1080 M1440 0 V1080"/>
  </g>

  <!-- glass panels -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="300" width="620" height="420" rx="42" fill="url(#glass)"
          stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="880" y="380" width="860" height="300" rx="36" fill="url(#glass)"
          stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(420 470)">
    <circle r="118" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="98" fill="none" stroke="url(#violet)" stroke-opacity="0.8" stroke-width="5"/>
    <path d="M-50 -18 l32 -28 l32 28 l-32 28 z" fill="url(#violet)"/>
    <path d="M-12 -18 l32 -28 l32 28 l-32 28 z" fill="url(#violet)"/>
    <path d="M-28 14 l56 0 l-28 66 z" fill="#@KOLIN_GLASS_ACCENT@" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="420" y="660" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="46" font-weight="600" letter-spacing="16" fill="#@KOLIN_GLASS_TEXT@" opacity="0.8">KOLINOS</text>
  <text x="961" y="560" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="30" font-weight="600" letter-spacing="12" fill="#@KOLIN_GLASS_TEXT@" opacity="0.55">CORVO GLASS</text>
  <text x="961" y="612" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif"
        font-size="20" letter-spacing="8" fill="#@KOLIN_GLASS_MUTED@" opacity="0.6">DEBIAN · ARM64 · 1.0</text>
</svg>
