# Perfil: rpi4 — Raspberry Pi 4 / 400.
#
# Um Raspberry Pi não tem UEFI de fábrica: o firmware (VideoCore) lê
# config.txt/cmdline.txt de uma partição FAT e procura um kernel. Há dois
# caminhos usuais e este perfil assume o segundo:
#   1. firmware -> kernel do próprio Pi (não é o caso: o kernel seria o do
#      raspberrypi/firmware, não o Debian);
#   2. firmware -> UEFI (instalado via rpi-eeprom) -> GRUB -> kernel Debian.
# O caminho 2 é o que reaproveita a imagem UEFI que a FASE 8 já produz, e é o
# que este perfil configura: a imagem é a mesma, com os device trees do bcm2711
# acrescentados à ESP e um `devicetree` no menu GRUB.
#
# Um Pi 4 com bootloader antigo não inicia UEFI: é preciso atualizar o EEPROM
# (rpi-eeprom-update) ou encadear U-Boot. Sem isso, nada aqui funciona.
KOLIN_DEVICE_ID="rpi4"
KOLIN_DEVICE_LABEL="Raspberry Pi 4 / 400 (UEFI em firmware ou U-Boot)"
KOLIN_DEVICE_KIND="sbc"
KOLIN_DEVICE_BOOTLOADER="firmware VideoCore -> EEPROM UEFI -> GRUB"
KOLIN_DEVICE_KERNEL="linux-image-arm64"
KOLIN_DEVICE_KERNEL_FLAVOR=""
# O diretório real é /usr/lib/linux-image-<versão>-arm64/broadcom/ — a versão do
# kernel faz parte do caminho. O estágio resolve com glob, não com literal.
KOLIN_DEVICE_DTB_DIR="broadcom"
KOLIN_DEVICE_DTB="bcm2711-rpi-4-b.dtb bcm2711-rpi-400.dtb"
KOLIN_DEVICE_CMDLINE="root=UUID=@KOLIN_ROOT_UUID@ ro quiet console=ttyS1,115200 console=tty0"
KOLIN_DEVICE_INITRD_MODULES=""
KOLIN_DEVICE_EXTRA_PKGS=""
KOLIN_DEVICE_BOOTIMG=0
KOLIN_DEVICE_NOTES="Exige EEPROM com UEFI (rpi-eeprom-update) ou U-Boot. Pi 4 com firmware antigo não inicia."
