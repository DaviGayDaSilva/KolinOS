# Perfil: generic-uefi — o caminho já exercitado na FASE 8.
# firmware UEFI -> GRUB -> kernel -> initrd. Cobre QEMU virt, VMs ARM64 e
# placas/PCs que expõem UEFI arm64. Nada é específico de um aparelho, então é o
# único perfil que o build produz sem `--device`.
KOLIN_DEVICE_ID="generic-uefi"
KOLIN_DEVICE_LABEL="Genérico UEFI (QEMU/VM/placa UEFI arm64)"
KOLIN_DEVICE_KIND="uefi"
KOLIN_DEVICE_BOOTLOADER="UEFI + GRUB (grub-efi-arm64-bin)"
KOLIN_DEVICE_KERNEL="linux-image-arm64"
KOLIN_DEVICE_KERNEL_FLAVOR=""
KOLIN_DEVICE_DTB_DIR=""
KOLIN_DEVICE_DTB=""
KOLIN_DEVICE_CMDLINE="root=UUID=@KOLIN_ROOT_UUID@ ro quiet"
KOLIN_DEVICE_INITRD_MODULES="virtio_pci virtio_blk virtio_scsi virtio_mmio 9p 9pnet 9pnet_virtio fscache"
KOLIN_DEVICE_EXTRA_PKGS=""
KOLIN_DEVICE_BOOTIMG=0
KOLIN_DEVICE_NOTES="Não inicializa em celular Android: o aparelho não tem UEFI."
