# Perfil: android-generic — celular Android com bootloader desbloqueado.
#
# Este perfil produz um boot.img Android REAL (header v2, kernel + initrd +
# dtb), montado pelas ferramentas do Debian (mkbootimg) e verificável por
# `kolinos-bootimg`. É o artefato que `fastboot flash boot` espera.
#
# A verdade desconfortável: ele quase nunca inicializa um celular. Um aparelho
# Android precisa de
#   * kernel com os drivers do SoC (GPU, modem, Wi-Fi, touch, painel) — o
#     linux-image-arm64 genérico não os tem;
#   * device tree do modelo exato — o bcm2711 do Pi não serve para um Snapdragon;
#   * assinatura que o bootloader aceita, quando ele não está desbloqueado;
#   * configuração de partições (root em /dev/... próprio do aparelho).
# Por isso o cmdline abaixo aponta para um root genérico e é um exemplo, não um
# valor pronto: cada aparelho tem seus caminhos.
#
# O perfil existe para dar o PASSO verificável: gerar um boot.img com formato
# correto, validá-lo, gravá-lo e observar até onde o aparelho chega. O
# bring-up de verdade é substituir o kernel e a DTB por um port específico.
#
# Requer bootloader DESBLOQUEADO (`fastboot flashing unlock`). Sem isso,
# `fastboot flash` recusa e nada é gravado.
KOLIN_DEVICE_ID="android-generic"
KOLIN_DEVICE_LABEL="Android genérico (bootloader desbloqueado, kernel genérico)"
KOLIN_DEVICE_KIND="android"
KOLIN_DEVICE_BOOTLOADER="ABL/LK + fastboot (bootloader desbloqueado)"
KOLIN_DEVICE_KERNEL="linux-image-arm64"
KOLIN_DEVICE_KERNEL_FLAVOR=""
# Sem DTB do aparelho o boot.img é gerado com uma DTB vazia válida apenas para
# exercitar o formato. Para bring-up a sério, aponte para a DTB do modelo.
KOLIN_DEVICE_DTB_DIR=""
KOLIN_DEVICE_DTB=""
KOLIN_DEVICE_CMDLINE="console=tty0 root=PARTLABEL=kolinos-root ro"
KOLIN_DEVICE_INITRD_MODULES=""
# Nada a instalar no alvo: mkbootimg é ferramenta de BUILD (host), não pacote
# do rootfs. Pacotes aqui seriam firmware/drivers do SoC, num port específico.
KOLIN_DEVICE_EXTRA_PKGS=""
KOLIN_DEVICE_BOOTIMG=1
KOLIN_DEVICE_NOTES="Quase nunca inicializa: o kernel Debian genérico não tem os drivers nem a DTB do aparelho. Exige bootloader desbloqueado."
