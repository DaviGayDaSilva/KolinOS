# KolinOS — minimal base system (applied by stage 10, before debootstrap second stage).
#
# Skeleton files (directory entries, /etc/default/rcS) are created at install
# time, so their mtime is the build clock and cannot be normalised by touching
# the rootfs afterwards. Listing them here makes dpkg record them as config
# files, so md5sums never embeds a variable timestamp.
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*
path-exclude=/usr/share/lintian/*
path-exclude=/usr/share/bug/*
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/locale/*
path-include=/usr/share/locale/locale.alias
path-include=/usr/share/locale/C/*
path-exclude=/var/lib/dpkg/updates
path-exclude=/etc/default/rcS
