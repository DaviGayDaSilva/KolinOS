# KolinOS "Corvo Glass" — foot terminal (FASE 7)
# foot is a fast, low-memory Wayland/X terminal often used on phones.
# Install path: /etc/xdg/foot/kolinos.ini
# Note: transparency (alpha) needs a compositor; under Termux:X11 it may be
# ignored. Colours below are the brand palette.

[main]
font=JetBrains Mono:size=11
dpi-aware=no
pad=10x14
term=xterm-256color
selection-target=both
workers=1

[scrollback]
lines=2000
indicator-position=relative

[cursor]
style=beam
blink=yes
color=2dd4bf 0c0a16

[colors]
alpha=0.94
background=0c0a16
foreground=f5f3ff
regular0=0c0a16
regular1=fb7185
regular2=4ade80
regular3=fbbf24
regular4=785ac8
regular5=a88bff
regular6=2dd4bf
regular7=d7d3ee
bright0=4a4468
bright1=fb7185
bright2=4ade80
bright3=fbbf24
bright4=a88bff
bright5=c4a9ff
bright6=5eead4
bright7=f5f3ff

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
