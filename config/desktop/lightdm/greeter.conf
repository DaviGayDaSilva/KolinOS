# KolinOS "Corvo Glass" — lightdm GTK greeter (FASE 7)
# Install path: /etc/lightdm/lightdm-gtk-greeter.conf
# Used only when lightdm is installed (it is a Suggests, not a dependency: most
# phone/Termux setups start the session by hand with kolinos-session or startx).

[greeter]
theme-name = CorvoGlass
icon-theme-name = hicolor
font-name = Inter 10
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %H:%M
keyboard = onboard
background = #07060D
user-background = false
