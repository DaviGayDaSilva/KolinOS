; KolinOS "Corvo Glass" — system-wide GTK 3 defaults (FASE 7)
; Install path: /etc/gtk-3.0/settings.ini
; Makes GTK 3 apps pick up the Corvo Glass theme, icon theme and font without
; a settings daemon running. Overridable per user (~/.config/gtk-3.0/settings.ini).

[Settings]
gtk-theme-name=CorvoGlass
gtk-icon-theme-name=hicolor
gtk-cursor-theme-name=Adwaita
gtk-font-name=Inter 10
gtk-application-prefer-dark-theme=1
gtk-enable-animations=1
gtk-primary-button-warps-slider=1
gtk-dialogs-use-header=1
