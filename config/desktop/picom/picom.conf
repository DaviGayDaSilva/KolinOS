# KolinOS "Corvo Glass" — picom (compositor) — FASE 7
#
# picom is what actually makes glassmorphism possible on a lightweight X stack:
# it applies real Gaussian blur behind translucent surfaces plus rounded corners
# and soft shadows. Without it, transparent windows just show the wallpaper.
#
# PERFORMANCE NOTE (phones / little RAM):
#   The default backend is GLX with dual_kawase blur. On Termux + Termux:X11
#   the GPU may only expose software GL (llvmpipe), which is slow. If the
#   session feels heavy, switch to the cheaper profile at the bottom of this
#   file or run without picom (openbox/tint2/GTK still look fine, just opaque).

backend = "glx";
vsync = true;

# --- shadows ---------------------------------------------------------------
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 10;
shadow-exclude = [
    "name = 'xeyes'",
    "class_g = 'tint2'",
    "class_g = 'Rofi'",
    "class_g = 'feh'",
    "class_g = 'lightdm-gtk-greeter'",
    "window_type = 'desktop'"
];

# --- rounded corners -------------------------------------------------------
corner-radius = 16;
rounded-corners-exclude = [
    "class_g = 'tint2'",
    "class_g = 'Rofi'",
    "window_type = 'desktop'"
];

# --- frosted glass ---------------------------------------------------------
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'feh'",
    "_GTK_FRAME_EXTENTS@"
];

# --- per-window translucency (lets the blur show through) ------------------
opacity-rule = [
    "96:class_g = 'XTerm'",
    "96:class_g = 'URxvt'",
    "94:class_g = 'Pcmanfm'"
];

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.92; };
    menu    = { shadow = true; blur-background = true; };
    dropdown_menu = { shadow = true; blur-background = true; };
    popup_menu    = { shadow = true; blur-background = true; };
    utility       = { shadow = true; };
};

# ---------------------------------------------------------------------------
# Cheaper profile for low-end ARM/software-GL devices — uncomment to use:
#
# backend = "xrender";
# blur-background = false;
# corner-radius = 0;
# shadow-radius = 14;
# shadow-opacity = 0.35;
# vsync = false;
# ---------------------------------------------------------------------------
